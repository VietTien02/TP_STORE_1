<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en" th:replace="~{/site/index :: dynamic(~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ</title>
    <style>
        .rounded-img {
            width: 200px;       /* tùy chỉnh kích thước */
            height: 200px;      /* nên đặt vuông để tròn hoàn hảo */
            border-radius: 50%; /* làm tròn ảnh */
            object-fit: cover;  /* cắt vừa khung hình */
        }
    </style>
</head>

<body>

<!--<div class="banner">-->
<!--    <img src="/image/logene.jpg" alt="" />-->
<!--</div>-->
    <div th:fragment="main">
        <div class="banner">
            <img th:src="@{/image/LTV-T3H.jpg}" alt="Ảnh" />
            <img th:src="@{/image/banner-copy.jpg}" alt="Ảnh" />
            <img th:src="@{/image/Reactjs.jpg}" alt="Ảnh" />

            <!-- Mũi tên -->
            <span class="prev">&#10094;</span>
            <span class="next">&#10095;</span>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const slides = document.querySelectorAll('.banner img');
                let current = 0;
                const duration = 1000; // 1s cho transform + opacity

                // Hiển thị slide đầu tiên
                slides.forEach((slide, index) => {
                    slide.style.position = 'absolute';
                    slide.style.top = 0;
                    slide.style.left = 0;
                    slide.style.width = '100%';
                    slide.style.height = '100%';
                    slide.style.objectFit = 'cover';
                    slide.style.transition = `transform ${duration}ms ease, opacity ${duration}ms ease`;
                    slide.style.transform = index === 0 ? 'translateX(0)' : 'translateX(100%)';
                    slide.style.opacity = index === 0 ? 1 : 0;
                });

                const nextBtn = document.querySelector('.next');
                const prevBtn = document.querySelector('.prev');

                function slideTo(nextIndex, direction) {
                    if (nextIndex === current) return;

                    const currentSlide = slides[current];
                    const nextSlide = slides[nextIndex];

                    // Chuẩn bị slide mới
                    nextSlide.style.transition = 'none';
                    nextSlide.style.transform = direction === 'next' ? 'translateX(100%)' : 'translateX(-100%)';
                    nextSlide.style.opacity = 0;
                    nextSlide.offsetHeight; // force reflow

                    // bật transition
                    currentSlide.style.transition = `transform ${duration}ms ease, opacity ${duration}ms ease`;
                    nextSlide.style.transition = `transform ${duration}ms ease, opacity ${duration}ms ease`;

                    // Di chuyển slide
                    currentSlide.style.transform = direction === 'next' ? 'translateX(-100%)' : 'translateX(100%)';
                    currentSlide.style.opacity = 0;

                    nextSlide.style.transform = 'translateX(0)';
                    nextSlide.style.opacity = 1;

                    current = nextIndex;
                }

                nextBtn.addEventListener('click', () => {
                    slideTo((current + 1) % slides.length, 'next');
                });

                prevBtn.addEventListener('click', () => {
                    slideTo((current - 1 + slides.length) % slides.length, 'prev');
                });

                // Auto slide
                let autoSlideTime = 5000; // 5s
                let autoSlide = setInterval(() => {
                    slideTo((current + 1) % slides.length, 'next');
                }, autoSlideTime);

                // Pause khi hover
                const banner = document.querySelector('.banner');
                banner.addEventListener('mouseenter', () => clearInterval(autoSlide));
                banner.addEventListener('mouseleave', () => {
                    autoSlide = setInterval(() => {
                        slideTo((current + 1) % slides.length, 'next');
                    }, autoSlideTime);
                });
            });
        </script>



        <section class="section_index-1">
            <div class="section_content">
                <h1>Khóa Học Miễn Phí</h1>
                <span>Các khóa học miễn phí dành cho các bạn mới !</span>
            </div>
            <div class="section_cards" >
                <div class="section_card" th:each="p:${courses}">

                        <img th:src="@{|${p.tps_image}|}" alt="" />

                        </div>
                    </div>
                    <p th:text="${p.tps_Name}"></p>
                    <div class="price_index-1">
                        <span>Miễn Phí</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="section_index-2">
            <div class="section_content-index2">
                <h1>Khóa Học Có Trả Phí</h1>
                <span>Các khóa học bạn nên mua !</span>
            </div>
            <div class="section_cards-index2">
                <div class="section_card-index2" th:each="p:${coursess}">
                    <div class="section_card-container-index2">
                        <img th:src="@{|${p.tps_image}|}" alt="" />
                        <div class="section_card-content-index2">
                            <a class="hide-index2" th:href="@{|/khoa-hoc/${p.tps_id}|}" >Mua Ngay</a>
                        </div>
                    </div>
                    <p th:text="${p.tps_Name}"></p>
                    <div class="price">
                        <b>Giá :</b>
                        <span><del th:text="${p.str_tps_discount}+' VND'"></del></span>
                        <span><strong th:text="${p.str_tps_price}+' VND'"></strong></span>
                    </div>
                </div>
            </div>
        </section>

        <div style="height: 50px" id="category"></div>
        <div class="title-container">
            <h1>Danh mục khóa học</h1>
        </div>
        <section class="section_category">
            <div class="category" >
                <div class="category-card" th:each="p:${categories}" th:if="${not #lists.isEmpty(p.courses)}">
                    <div class="category-card-title">
                        <h2 th:text="${p.tps_Name}"style="color: black"  ></h2>
                        <p   style="color: black" th:text="${#lists.size(p.courses)} + ' khóa học'"></p>
                    </div>
                    <div class="category-image">
                        <a th:href="@{|/danh-muc/${p.tps_Id}|}"><img th:src="@{|${p.tps_Image}|}" alt="" /></a>
                    </div>
                </div>

            </div>
        </section>

        <section class="layout-container">
            <h1>Lợi ích khi mua khóa học</h1>
            <div class="layout_container-cards">
                <div class="layout_container-card">
                    <div class="layout_container-card-img">
                        <img src="/image/video.png" alt="" />
                    </div>
                    <span>Video quay full HD</span>
                </div>
                <div class="layout_container-card">
                    <div class="layout_container-card-img">
                        <img src="/image/document.png" alt="" />
                    </div>
                    <span>Mua 1 lần, học mãi mãi</span>
                </div>
                <div class="layout_container-card">
                    <div class="layout_container-card-img">
                        <img src="/image/Support.png" alt="" />
                    </div>
                    <span>Hỗ trợ khi gặp khó khăn</span>
                </div>
                <div class="layout_container-card">
                    <div class="layout_container-card-img">
                        <img src="/image/Promotions.png" alt="" />
                    </div>
                    <span>Nhiều ưu đãi cho học viên</span>
                </div>
            </div>
        </section>
    </div>
</body>
